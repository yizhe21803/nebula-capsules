  </g>
  <!-- ULTRAVIOLET -->
  <g transform="translate(1182 282)" class="sans">
    <text class="top mono">NC-04  <tspan font-weight="700">ULTRAVIOLET</tspan></text><text x="477" class="live mono">LIVE</text>
