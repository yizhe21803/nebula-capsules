    <text class="top mono">NC-05  <tspan font-weight="700">CHROME</tspan></text><text x="477" class="live mono">LIVE</text>
    <g transform="translate(0 17)" filter="url(#shadow)"><rect width="505" height="145" rx="73" fill="url(#g5)" filter="url(#marble1)"/><rect width="205" height="145" rx="73" fill="url(#paperFade)"/><g transform="translate(35 31)"><text class="code mono">NC-05</text><text y="35" class="name">CHROME</text><text y="62" class="brand">画境观屿</text><text y="79" class="brand-en mono">HUA JING GUAN YU</text><text y="92" class="state mono">LIVE COSMIC STUDY</text></g></g>
  </g>
