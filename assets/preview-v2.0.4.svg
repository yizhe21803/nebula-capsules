  <g transform="translate(645 700)" class="sans dark">
    <text class="top mono">NC-07  <tspan font-weight="700">POLAR</tspan></text><text x="477" class="live mono">LIVE</text>
    <g transform="translate(0 17)"><rect width="505" height="145" rx="73" fill="url(#g7)"/><rect width="220" height="145" rx="73" fill="#202126"/><rect x="185" width="90" height="145" fill="url(#g7)" opacity=".18"/><g transform="translate(35 31)"><text class="code mono">NC-07</text><text y="35" class="name">POLAR</text><text y="62" class="brand">YOU MADE A SALE</text><text y="79" class="brand-en mono">SOFT AURORA CAPSULE</text><text y="92" class="state mono">LIVE AURORA STUDY</text></g></g>
  </g>
  <!-- DUBDOT -->
  <g transform="translate(1182 700)" class="sans">
    <text class="top mono">NC-08  <tspan font-weight="700">DUBDOT</tspan></text><text x="477" class="live mono">LIVE</text>
    <g transform="translate(0 17)" filter="url(#shadow)"><rect width="505" height="145" rx="73" fill="url(#g8)"/><rect width="205" height="145" rx="73" fill="url(#paperFade)"/><g transform="translate(35 31)"><text class="code mono">NC-08</text><text y="35" class="name">DUBDOT</text><text y="62" class="brand">$2000 COMMISSION</text><text y="79" class="brand-en mono">SOFT AURORA CAPSULE</text><text y="92" class="state mono">LIVE AURORA STUDY</text></g></g>
